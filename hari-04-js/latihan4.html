<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kalkulator BMI</title>
  </head>
  <body>
    <h1>Kalkulator BMI</h1>
    <label for="berat">Berat (kg)</label>
    <input type="number" id="berat" min="1" />
    <label for="tinggi">Tinggi (cm)</label>
    <input type="number" id="tinggi" min="1" />
    <button id="hitung">Hitung</button>
    <p id="hasil"></p>
    <script>
      const tombol = document.getElementById("hitung");
      tombol.addEventListener("click", () => {
        const berat = Number(document.getElementById("berat").value);
        const tinggiMeter =
          Number(document.getElementById("tinggi").value) / 100;
        const hasil = document.getElementById("hasil");
        if (berat <= 0 || tinggiMeter <= 0) {
          hasil.textContent = "Masukkan berat dan tinggi yang valid.";
          return;
        }
        const bmi = berat / (tinggiMeter * tinggiMeter);
        let kategori = "Normal";
        if (bmi < 18.5) kategori = "Kurang";
        else if (bmi >= 30) kategori = "Obesitas";
        else if (bmi >= 25) kategori = "Lebih";
        hasil.textContent = `BMI ${bmi.toFixed(1)} (${kategori})`;
      });
    </script>
  </body>
</html>
